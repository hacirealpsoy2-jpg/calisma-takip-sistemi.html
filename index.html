<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Çalışma ve Sağlık Takip Sistemi</title>
    <meta http-equiv="refresh" content="0; url=calisma-takip-sistemi.html">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #4a6fa5;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Gelişmiş Çalışma ve Sağlık Takip Sistemi</h1>
        <p>Yönlendiriliyorsunuz...</p>
        <div class="loader"></div>
        <p>Eğer yönlendirilmiyorsanız <a href="calisma-takip-sistemi.html" style="color: #ff7e5f; text-decoration: underline;">buraya tıklayın</a></p>
    </div>
</body>
</html>
